version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      github-workflow-actions:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      application-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/hack/pulumi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      pulumi-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/hack/pulumi/azure-storage"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      azure-storage-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/skip-codecov"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-skip-codecov-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      docs-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      application-images:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      dashboard-images:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # TODO: typescript-eslint does not support TypeScript 7 yet (its peer
      # range is <6.1.0). Check back on typescript-eslint and remove this
      # ignore rule once a release supports TypeScript 7. See
      # https://github.com/artefactual-sdps/enduro/issues/1870.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dashboard-dependencies:
        patterns:
          - "*"
