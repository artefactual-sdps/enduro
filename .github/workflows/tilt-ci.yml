on:
  pull_request:
  push:
    branches:
      - main
name: Tilt CI
jobs:
  tilt-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Expose GitHub Actions cache variables
        uses: crazy-max/ghaction-github-runtime@b3a9207c0e1ef41f4cf215303c976869d0c2c1c4 # v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          driver-opts: |
            env.ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            env.ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
      - name: Create k8s cluster
        uses: AbsaOSS/k3d-action@4e8b3239042be1dc0aed6c5eb80c13b18200fc79 # v2.4.0
        with:
          cluster-name: sdps-ci
          k3d-version: v5.8.3
          args: >-
            --registry-create sdps-ci-registry
            --no-lb
            --timeout 180s
            --k3s-arg "--disable=traefik,servicelb,metrics-server@server:*"
            --k3s-arg "--kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%@server:*"
      - name: Install Tilt
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            tilt
          tilt: v0.35.2
      - name: Check tilt ci
        run: tilt ci
        env:
          BUILD_OPTS: >-
            --cache-from type=gha,scope=enduro
            --cache-to type=gha,scope=enduro,mode=max
