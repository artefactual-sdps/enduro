apiVersion: apps/v1
kind: Deployment
metadata:
  name: ambox
  labels:
    app: ambox
spec:
  replicas: 1
  # Each ambox pod has its own database and files. A rolling update could
  # send an SFTP upload to one pod and its transfer API request to another.
  # Stop the old pod before starting its replacement; downtime is intentional.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ambox
  template:
    metadata:
      labels:
        app: ambox
    spec:
      # ambox does not use the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: ambox
          image: docker.io/artefactual/ambox:1.2.1
          ports:
            - name: am-dashboard
              containerPort: 64080
            - name: am-ss
              containerPort: 64081
            - name: am-sftp
              containerPort: 64022
          # Configuration is applied once during s6 startup, after AM and SS
          # respond. Allow up to five minutes before treating startup as failed.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /command/s6-rc -a list | grep -qx config
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Check both HTTP front doors and the SFTP banner before routing work.
          # No liveness probe: s6 supervises services without restarting MySQL
          # and interrupting every in-flight transfer on a transient failure.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  curl --fail --silent --show-error --max-time 2 --output /dev/null http://127.0.0.1:64080/
                  curl --fail --silent --show-error --max-time 2 --output /dev/null http://127.0.0.1:64081/
                  read -r -t 2 ssh_banner < /dev/tcp/127.0.0.1/64022
                  [[ "$ssh_banner" == SSH-2.0-* ]]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          volumeMounts:
            # Mount only storage endpoints so image-provided directories and
            # bundled sample transfers remain available on a fresh pod.
            - name: am-aip-store
              mountPath: /var/archivematica/sharedDirectory/www/AIPsStore
            - name: am-dip-store
              mountPath: /var/archivematica/sharedDirectory/www/DIPsStore
            - name: am-transfers
              mountPath: /home/archivematica/transfers
            - name: ambox-hostkey
              mountPath: /etc/sftpgo/keys/host_ed25519
              subPath: host_ed25519
              readOnly: true
            - name: ambox-config
              mountPath: /etc/ambox/config.yaml
              subPath: config.yaml
      # TODO: support and test retaining MySQL and associated files together.
      # These volumes disappear with the pod; MySQL is in the container layer.
      # Replacing ambox can leave Enduro records pointing to unavailable AIPs.
      # Persisting only these file volumes would not preserve AMSS records.
      volumes:
        - name: am-aip-store
          emptyDir: {}
        - name: am-dip-store
          emptyDir: {}
        - name: am-transfers
          emptyDir: {}
        - name: ambox-hostkey
          secret:
            secretName: ambox-hostkey
            items:
              - key: host_ed25519
                path: host_ed25519
                mode: 0640
        - name: ambox-config
          configMap:
            name: ambox-config
---
apiVersion: v1
kind: Service
metadata:
  name: ambox
  labels:
    app: ambox
spec:
  selector:
    app: ambox
  ports:
    - name: am-dashboard
      port: 64080
      targetPort: 64080
    - name: am-ss
      port: 64081
      targetPort: 64081
    - name: am-sftp
      port: 64022
      targetPort: 64022
---
apiVersion: v1
kind: Secret
metadata:
  name: ambox-hostkey
  labels:
    app: ambox
type: Opaque
stringData:
  host_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
    QyNTUxOQAAACDGjcA9OMF7WaRKF7GmIapVbjDixiYKWNVyHftCmdYGQwAAAJjnao2s52qN
    rAAAAAtzc2gtZWQyNTUxOQAAACDGjcA9OMF7WaRKF7GmIapVbjDixiYKWNVyHftCmdYGQw
    AAAEDV0g3EjFUxwhHkSmPceORX5hZWDnGrweyOIWy259byk8aNwD04wXtZpEoXsaYhqlVu
    MOLGJgpY1XId+0KZ1gZDAAAAEWplc3VzQGNhc2lvLmxvY2FsAQIDBA==
    -----END OPENSSH PRIVATE KEY-----
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambox-config
  labels:
    app: ambox
data:
  # https://github.com/sevein/ambox/tree/dev/ambox/hack/box/config
  config.yaml: |
    version: v1
    sftpgo:
      host_key: /etc/sftpgo/keys/host_ed25519
    processing:
      configs:
        - name: automated
          extends: automated
          config:
            normalize: do_not_normalize
